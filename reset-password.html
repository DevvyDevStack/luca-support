<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luca – Reset password</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 420px;
      margin: 2rem auto;
      padding: 0 1.25rem 2rem;
      color: #2E343C;
      line-height: 1.5;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    .muted { color: #666; font-size: 0.95rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 0.35rem; font-size: 0.9rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
    }
    button, .btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 999px;
      background: #6B5B4F;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #b42318; margin-top: 1rem; }
    .success { color: #027a48; margin-top: 1rem; }
    .secondary {
      background: transparent;
      color: #6B5B4F;
      border: 1px solid #6B5B4F;
      margin-top: 0.75rem;
    }
    #panel-form { display: none; }
  </style>
</head>
<body>
  <h1>Reset your Luca password</h1>
  <p id="status" class="muted">Verifying your reset link…</p>

  <div id="panel-form">
    <p class="muted">Choose a new password for your account.</p>
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter password">
    <button type="button" id="submit">Update password</button>
  </div>

  <p id="message" class="error" style="display:none"></p>
  <p id="success" class="success" style="display:none"></p>
  <a id="open-app" class="btn secondary" href="luca://reset-password" style="display:none">Open Luca app</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      var SUPABASE_URL = 'https://ohvwjudhzwlwqdbyyjbz.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9odndqdWRoendsd3FkYnl5amJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwODQ5NzAsImV4cCI6MjA4NjY2MDk3MH0.eojaqzptP_hiFhduxM60KJaF3ME4JDhDn53s7kNpoQU';
      var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      var statusEl = document.getElementById('status');
      var formPanel = document.getElementById('panel-form');
      var messageEl = document.getElementById('message');
      var successEl = document.getElementById('success');
      var openAppEl = document.getElementById('open-app');
      var submitBtn = document.getElementById('submit');

      function showError(text) {
        messageEl.textContent = text;
        messageEl.style.display = 'block';
        successEl.style.display = 'none';
      }

      function parseParams() {
        var out = {};
        var hash = window.location.hash ? window.location.hash.substring(1) : '';
        var search = window.location.search ? window.location.search.substring(1) : '';
        [hash, search].forEach(function (part) {
          if (!part) return;
          part.split('&').forEach(function (pair) {
            var i = pair.indexOf('=');
            if (i === -1) return;
            out[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
          });
        });
        return out;
      }

      async function establishSession() {
        var params = parseParams();
        if (params.code) {
          var exchanged = await supabase.auth.exchangeCodeForSession(params.code);
          if (exchanged.error) throw exchanged.error;
          return;
        }
        if (params.access_token && params.refresh_token) {
          var set = await supabase.auth.setSession({
            access_token: params.access_token,
            refresh_token: params.refresh_token,
          });
          if (set.error) throw set.error;
          return;
        }
        throw new Error('This reset link is invalid or has expired. Request a new one from the Luca app.');
      }

      async function init() {
        try {
          await establishSession();
          statusEl.textContent = '';
          formPanel.style.display = 'block';

          var suffix = window.location.hash || window.location.search || '';
          openAppEl.href = 'luca://reset-password' + suffix;
          openAppEl.style.display = 'block';
          openAppEl.textContent = 'Prefer the app? Open Luca';
        } catch (err) {
          statusEl.textContent = '';
          showError(err.message || 'Could not verify reset link.');
        }
      }

      submitBtn.addEventListener('click', async function () {
        messageEl.style.display = 'none';
        successEl.style.display = 'none';
        var password = document.getElementById('password').value;
        var confirm = document.getElementById('confirm').value;
        if (password.length < 8) {
          showError('Use at least 8 characters.');
          return;
        }
        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }
        submitBtn.disabled = true;
        try {
          var result = await supabase.auth.updateUser({ password: password });
          if (result.error) throw result.error;
          formPanel.style.display = 'none';
          openAppEl.style.display = 'none';
          successEl.textContent = 'Password updated. Open Luca and sign in with your new password.';
          successEl.style.display = 'block';
          await supabase.auth.signOut();
        } catch (err) {
          showError(err.message || 'Could not update password.');
          submitBtn.disabled = false;
        }
      });

      init();
    })();
  </script>
</body>
</html>
