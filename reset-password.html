<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luca – Reset password</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #333;
      line-height: 1.5;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-bottom: 0.75rem; }
    p { margin: 0.75rem 0; color: #555; }
    a { color: #6B5B4F; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Opening Luca…</h1>
  <p id="status">Sending you back to the app to choose a new password.</p>
  <p><a id="manual" href="luca://reset-password" style="display:none;">Open Luca</a></p>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var suffix = hash || search;
      var appUrl = 'luca://reset-password' + suffix;

      if (suffix) {
        window.location.replace(appUrl);
      }

      setTimeout(function () {
        var link = document.getElementById('manual');
        link.href = appUrl;
        link.style.display = 'inline';
        document.getElementById('status').textContent =
          'If Luca did not open automatically, tap “Open Luca” below (use the device where the app is installed).';
      }, 1200);
    })();
  </script>
</body>
</html>
