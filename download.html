<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Get Luca – Your Personal Stylist</title>
  <meta name="description" content="Luca is a body-positive styling companion. Download for iPhone or Android.">

  <!-- Cormorant and Outfit are the app's display and body faces (FONTS in
       constants/theme.ts), so the page uses the real typefaces rather than an
       approximation. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;700&family=Outfit:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    /* Palette lifted from constants/theme.ts — THEME_DARK, since this page is
       dark. Background is midnight-800, the app's dark `surface`; text is
       cream-200 and midnight-300, its `text` and `textSecondary`. */
    :root {
      --midnight-800: #2E343C;
      --midnight-700: #3D444E;
      --midnight-300: #A3AAB5;
      --cream-200: #FAF0EA;
      --taupe-400: #D8CFC1;
    }

    * {
      box-sizing: border-box;
    }

    /* body is a centred 480px column, so html carries the colour too —
       otherwise everything either side of it stays white. */
    html {
      background-color: var(--midnight-800);
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--midnight-800);
      color: var(--cream-200);
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.25rem 2rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: 'Cormorant', Georgia, serif;
      font-weight: 700;
      font-size: 2.75rem;
      line-height: 1.1;
      margin: 0;
    }

    .tagline {
      font-family: 'Cormorant', Georgia, serif;
      font-size: 1.375rem;
      color: var(--midnight-300);
      margin: 0.25rem 0 2rem;
    }

    .intro {
      margin: 0 0 2rem;
      color: var(--midnight-300);
    }

    /* The badges are the buttons. Both are official artwork and neither may be
       recoloured or redrawn, so the only styling here is sizing and spacing. */
    .badges {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .badges a {
      display: inline-block;
      /* Apple's SVG is trimmed to the button edge; Google's PNG carries its
         required clear space inside the image, about a sixth of its height.
         Hence the different numbers for the same visual button height. */
      line-height: 0;
    }

    .badges a:focus-visible {
      outline: 2px solid var(--cream-200);
      outline-offset: 4px;
      border-radius: 8px;
    }

    .badge-apple img {
      height: 48px;
      width: auto;
    }

    .badge-google img {
      height: 72px;
      width: auto;
    }

    .nav {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--midnight-700);
      font-size: 0.9rem;
      color: var(--midnight-300);
    }

    .nav a {
      color: var(--midnight-300);
      margin-right: 1rem;
      text-decoration: none;
      border-bottom: 1px solid var(--taupe-400);
    }

    .nav a:hover {
      color: var(--cream-200);
    }

    @media (min-width: 420px) {
      .badges {
        flex-direction: row;
        justify-content: center;
        gap: 0.75rem;
      }
    }
  </style>
</head>

<body>
  <h1>Luca</h1>
  <p class="tagline">Your Personal Stylist</p>

  <p class="intro">A body-positive styling companion. Build your wardrobe, get outfit
    recommendations that suit your shape and colouring, and dress with a little more
    confidence each morning.</p>

  <div class="badges">
    <a class="badge-apple" href="https://apps.apple.com/app/id6759270428">
      <img src="assets/app-store-badge.svg" alt="Download Luca on the App Store" width="144" height="48">
    </a>
    <a class="badge-google" href="https://play.google.com/store/apps/details?id=com.luca.style">
      <img src="assets/google-play-badge.png" alt="Get Luca on Google Play" width="186" height="72">
    </a>
  </div>

  <p class="nav">
    <a href="index.html">Support</a>
    <a href="privacyPolicy.html">Privacy Policy</a>
    <a href="termsOfService.html">Terms of Service</a>
  </p>
</body>

</html>
